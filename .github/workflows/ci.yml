name: CI

on:
  push:
  pull_request:

jobs:
  buf:
    name: Buf Check
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Lint and Format
        run: nix develop --command bash -c "buf lint proto && buf format --diff --exit-code"

  frontend:
    name: Frontend CI
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install Dependencies
        run: nix develop --command bash -c "cd frontend && npm ci"
      - name: Generate Proto
        run: nix develop --command bash -c "cd frontend && npm run generate"
      - name: Lint
        run: nix develop --command bash -c "cd frontend && npm run lint"
      - name: Test
        run: nix develop --command bash -c "cd frontend && npm test"
      - name: Build
        run: nix develop --command bash -c "cd frontend && npm run build"

  backend:
    name: Backend CI
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install Frontend Deps & Generate
        run: nix develop --command bash -c "cd frontend && npm ci && npm run generate"
      
      - name: Check Formatting
        run: nix develop --command bash -c "cd backend && cargo fmt --all -- --check"
        continue-on-error: true
      
      - name: Lint
        run: nix develop --command bash -c "cd backend && cargo clippy -- -D warnings"
        continue-on-error: true
        
      - name: Build
        run: nix develop --command bash -c "cd backend && cargo build"
        
      - name: Test
        run: nix develop --command bash -c "cd backend && cargo test"
