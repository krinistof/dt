syntax = "proto3";

package dt.v1;

message Event {
    string client_key = 1;
    string action = 2;
    string payload = 3;
}

message SubmitEventRequest {
    string user_token = 1;
    Event event = 2;
}

message SubmitEventResponse {
    bool success = 1;
}

service Dt {
    rpc SubmitEvent(SubmitEventRequest) returns (SubmitEventResponse);
}
